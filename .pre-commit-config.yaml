repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        description: Attempts to load all yaml files to verify syntax.
        args: [--allow-multiple-documents]
      - id: detect-private-key
        description: Checks for the existence of private keys.
      - id: end-of-file-fixer
        description: Makes sure files end in a newline and only a newline.
      - id: mixed-line-ending
        description: Checks mixed line ending.
        args: [--fix=no]
      - id: trailing-whitespace
        description: Trims trailing whitespace, excluding Markdown files.
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        description: Reformat all Terraform configuration files to a canonical format.
      - id: terraform_validate
        description: Validates all Terraform configuration files.
      - id: terraform_docs
        description: Inserts input and output documentation into README.md.
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
          - --args=--config=.terraform-docs.yml
