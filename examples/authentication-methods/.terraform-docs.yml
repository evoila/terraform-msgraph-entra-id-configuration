# Partial terraform-docs config for module examples

header-from: "_header.md"
footer-from: "_footer.md"

content: |-
  <!-- Code generated by terraform-docs. DO NOT EDIT. -->
  {{ .Header }}

  ```hcl
  {{ include "main.tf" }}
  ```

  <!-- markdownlint-disable MD033 -->
  {{ .Requirements }}

  {{ .Resources }}

  <!-- markdownlint-disable MD013 -->
  {{ .Inputs }}

  {{ .Outputs }}

  {{ .Modules }}

  {{ .Footer }}

settings:
  hide-empty: false
